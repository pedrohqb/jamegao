<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Confirmação - Jamegão</title>
  <link rel="stylesheet" href="ui.css">
</head>
<body>
  <h1 id="titulo">Confirmação</h1>
  <p id="origem"></p>
  <p id="site" hidden></p>
  <p id="assinatura" hidden></p>
  <div id="bloco-certificado" hidden>
    <label for="certificado">Certificado</label>
    <select id="certificado"></select>
  </div>
  <p id="vencimento" class="aviso" hidden></p>
  <p id="cadeia" hidden></p>
  <div id="bloco-senha" hidden>
    <label for="senha">Senha do cofre</label>
    <input type="password" id="senha" autocomplete="off">
  </div>
  <div id="status" role="status"></div>
  <button id="confirmar" type="button">Confirmar</button>
  <button id="recusar" type="button">Recusar</button>
  <button id="bloquear" type="button">Bloquear este site</button>
  <button id="programa" type="button" hidden>Usar o programa instalado</button>
  <button id="fechar" type="button" hidden>Fechar</button>
  <script type="module" src="confirm.js"></script>
</body>
</html>
